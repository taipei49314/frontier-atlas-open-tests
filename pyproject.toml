[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-atlas-open-tests"
version = "0.1.0"
description = "Offline public protocol verifier for Frontier Atlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlas-test = "atlas_test.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_test = ["schemas/*.json"]
